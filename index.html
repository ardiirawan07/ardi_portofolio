<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Nota Thermal</title>
    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700;800&family=Libre+Barcode+39+Extended+Text&display=swap"
        rel="stylesheet">

    <style>
        /* === CSS RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8fafc;
            background-image:
                radial-gradient(at 0% 0%, #e0f2fe 0, transparent 50%),
                radial-gradient(at 50% 0%, #dbeafe 0, transparent 50%),
                radial-gradient(at 100% 0%, #eff6ff 0, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 1.5rem 1rem;
        }

        /* === ANIMATED BACKGROUND BLOBS === */
        .blobs-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: multiply;
            filter: blur(100px);
            animation: blob 7s infinite alternate;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background-color: rgba(186, 230, 253, 0.5);
        }

        .blob-2 {
            top: 20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background-color: rgba(191, 219, 254, 0.5);
            animation-delay: 2s;
            filter: blur(120px);
        }

        .blob-3 {
            bottom: -20%;
            left: 20%;
            width: 70vw;
            height: 70vw;
            background-color: rgba(167, 243, 208, 0.3);
            animation-delay: 4s;
        }

        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        /* === LAYOUT === */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            background: #eff6ff;
            backdrop-filter: blur(12px);
            border: 1px solid #bfdbfe;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2563eb;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.1);
        }

        .title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(to right, #0f172a, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #64748b;
            font-size: clamp(0.9rem, 2vw, 1.125rem);
            font-weight: 400;
        }

        .grid-layout {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: flex-start;
        }

        @media (min-width: 1024px) {
            .grid-layout {
                flex-direction: row;
            }

            .form-section {
                width: 55%;
            }

            .preview-section {
                width: 45%;
            }
        }

        /* === GLASSMORPHISM PANELS === */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 1);
            padding: 1.5rem;
            width: 100%;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease-out forwards;
        }

        @media (min-width: 640px) {
            .glass-panel {
                padding: 2rem;
                border-radius: 2rem;
            }
        }

        .glass-panel-glow {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 1), transparent);
        }

        .panel-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .panel-header {
                font-size: 1.5rem;
                margin-bottom: 2rem;
            }
        }

        .panel-icon {
            padding: 0.5rem;
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.1);
            border-radius: 0.75rem;
            font-size: 1.2rem;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === FORM ELEMENTS === */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .glass-input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 1rem;
            color: #0f172a;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        @media (min-width: 640px) {
            .glass-input {
                padding: 1rem 1.25rem;
                font-size: 1rem;
            }
        }

        .glass-input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            outline: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Radios */
        .radio-group {
            display: flex;
            gap: 0.5rem;
        }

        .radio-label {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 0.5rem;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 1rem;
            color: #64748b;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        @media (min-width: 640px) {
            .radio-label {
                font-size: 0.875rem;
            }
        }

        .radio-label input {
            display: none;
        }

        .radio-label.active {
            background: #eff6ff;
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
            color: #2563eb;
        }

        /* Product List */
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 1.5rem;
        }

        .btn-add {
            background: #ffffff;
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #2563eb;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.05);
        }

        .btn-add:hover {
            background: #eff6ff;
            border-color: #3b82f6;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(37, 99, 235, 0.1);
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.5rem;
            padding-bottom: 1rem;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 1rem;
            border-radius: 1.25rem;
            position: relative;
            transition: all 0.3s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }

        @media (min-width: 640px) {
            .product-item {
                padding: 1.5rem;
                border-radius: 1.5rem;
            }
        }

        .product-item:hover {
            background: #ffffff;
            border-color: rgba(148, 163, 184, 0.4);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        .product-name-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(148, 163, 184, 0.3);
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            padding: 0.25rem 0;
            margin-bottom: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        @media (min-width: 640px) {
            .product-name-input {
                font-size: 1.125rem;
            }
        }

        .product-name-input:focus {
            outline: none;
            border-bottom-color: #3b82f6;
        }

        .product-name-input::placeholder {
            color: #94a3b8;
            font-weight: 500;
        }

        .product-details {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        @media (min-width: 640px) {
            .product-details {
                flex-direction: row;
                gap: 1rem;
            }
        }

        .input-with-prefix {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .input-prefix {
            position: absolute;
            left: 1rem;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .input-with-prefix input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 0.75rem;
            color: #0f172a;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .input-with-prefix input:focus {
            background: #ffffff;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            outline: none;
        }

        .qty-input-container {
            width: 100%;
        }

        @media (min-width: 640px) {
            .qty-input-container {
                width: 120px;
            }
        }

        .btn-remove {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #ef4444;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
            transition: all 0.2s;
            font-size: 0.8rem;
            font-weight: bold;
        }

        @media (min-width: 640px) {
            .btn-remove {
                opacity: 0;
                transform: scale(0.8);
                width: 32px;
                height: 32px;
                font-size: 1rem;
            }

            .product-item:hover .btn-remove {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-remove:hover {
            background: #dc2626;
            transform: scale(1.1) !important;
        }

        .payment-section {
            margin-top: 1.5rem;
            border-top: 1px solid rgba(148, 163, 184, 0.2);
            padding-top: 1.5rem;
        }

        /* The main bright blue action button */
        .btn-print {
            width: 100%;
            margin-top: 1.5rem;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            padding: 1rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        @media (min-width: 640px) {
            .btn-print {
                font-size: 1.125rem;
                padding: 1.25rem;
            }
        }

        .btn-print:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        /* === PREVIEW SECTION === */
        .preview-outer {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            padding: 1rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
        }

        @media (min-width: 640px) {
            .preview-outer {
                padding: 1.5rem;
                border-radius: 2rem;
            }
        }

        .preview-title {
            position: absolute;
            top: 1.2rem;
            left: 1.5rem;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #64748b;
            text-transform: uppercase;
        }

        .preview-dots {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            display: flex;
            gap: 6px;
        }

        .preview-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .preview-dots span:nth-child(1) {
            background: #f87171;
        }

        .preview-dots span:nth-child(2) {
            background: #fbbf24;
        }

        .preview-dots span:nth-child(3) {
            background: #34d399;
        }

        .receipt-wrapper {
            margin-top: 2rem;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 1rem 0;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }

        /* === THE PREMIUM THERMAL RECEIPT === */
        #printable-receipt {
            background: #ffffff;
            color: #000000;
            font-family: 'JetBrains Mono', monospace;
            padding: 15px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border-radius: 2px;
            transition: width 0.3s ease;
            position: relative;
            height: fit-content;
            overflow: visible;
        }

        .receipt-58 {
            width: 58mm;
            max-width: 100%;
            font-size: 11px;
        }

        .receipt-80 {
            width: 80mm;
            max-width: 100%;
            font-size: 12px;
        }

        .r-header {
            text-align: center;
            margin-bottom: 10px;
        }

        .r-brand {
            font-size: 1.5em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            line-height: 1.1;
            font-family: 'Inter', sans-serif;
        }

        .r-address {
            font-size: 0.85em;
            font-weight: 400;
            margin-bottom: 2px;
        }

        .r-phone {
            font-size: 0.85em;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .r-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.85em;
            margin-bottom: 2px;
        }

        .r-divider {
            border-top: 1.5px dashed #1a1a1a;
            margin: 8px 0;
        }

        .r-divider-solid {
            border-top: 2px solid #000;
            margin: 10px 0;
        }

        .r-product {
            margin-bottom: 6px;
        }

        .r-product-name {
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 2px;
            word-break: break-all;
        }

        .r-product-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .r-totals {
            font-size: 0.95em;
        }

        .r-total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
            font-weight: 400;
        }

        .r-grand-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2em;
            font-weight: 800;
            margin-top: 5px;
        }

        .r-payment {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-weight: 400;
        }

        .r-change {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-weight: 700;
        }

        .r-footer {
            text-align: center;
            margin-top: 15px;
        }

        .r-footer p {
            margin-bottom: 2px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .r-barcode-container {
            margin-top: 10px;
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        .r-barcode {
            font-family: 'Libre Barcode 39 Extended Text', cursive;
            font-size: 28px;
            line-height: 1;
            font-weight: normal;
            white-space: nowrap;
            transform-origin: center;
        }

        .receipt-80 .r-barcode {
            font-size: 38px;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === PRINT STYLES === */
        @media print {

            body,
            html {
                margin: 0;
                padding: 0;
                background: white;
                min-height: auto;
                width: 100%;
                height: auto;
            }

            body * {
                visibility: hidden;
            }

            .hide-on-print {
                display: none !important;
            }

            #printable-receipt,
            #printable-receipt * {
                visibility: visible;
            }

            #printable-receipt {
                position: absolute;
                left: 0;
                top: 0;
                margin: 0;
                box-shadow: none !important;
                border-radius: 0 !important;
            }

            .container,
            .grid-layout,
            .preview-section,
            .preview-outer,
            .receipt-wrapper,
            .glass-panel {
                position: static !important;
                overflow: visible !important;
                transform: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }
        }
    </style>
    <style id="print-page-style">
        @media print {
            @page {
                margin: 0;
            }
        }
    </style>
</head>

<body>

    <div class="blobs-container hide-on-print">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">

        <div class="header hide-on-print">
            <h1 class="title">Cetak Nota Thermal</h1>
        </div>

        <div class="grid-layout">

            <!-- FORM SECTION -->
            <div class="form-section glass-panel hide-on-print">
                <div class="glass-panel-glow"></div>

                <div class="panel-header">
                    <span class="panel-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" />
                            <path d="M4 12v8a2 2 0 0 0 2 2h2" />
                            <path d="M20 12v8a2 2 0 0 1-2 2h-2" />
                            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" />
                            <path d="M2 7h20" />
                            <path
                                d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7" />
                        </svg>
                    </span>
                    Data Profil & Nota
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nama Toko/Brand</label>
                        <input type="text" id="brandNameInput" value="CAFE AESTHETIC" class="glass-input"
                            placeholder="Masukkan Nama Toko">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nomor HP / Telepon</label>
                        <input type="text" id="phoneInput" value="0812-3456-7890" class="glass-input"
                            placeholder="0812-xxxx-xxxx">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Alamat Lengkap</label>
                    <input type="text" id="addressInput" value="Jl. Jend. Sudirman No. 123, Jakarta" class="glass-input"
                        placeholder="Masukkan alamat lengkap">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Ukuran Kertas</label>
                        <div class="radio-group">
                            <label id="lbl-size-58mm" class="radio-label active">
                                <input type="radio" name="paperSize" value="58mm" checked
                                    onchange="updatePaperSize('58mm')">
                                58mm
                            </label>
                            <label id="lbl-size-80mm" class="radio-label">
                                <input type="radio" name="paperSize" value="80mm" onchange="updatePaperSize('80mm')">
                                80mm
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Pajak (PPN)</label>
                        <div class="radio-group">
                            <label id="lbl-ppn-0" class="radio-label">
                                <input type="radio" name="ppn" value="0" onchange="updatePPN(0)">
                                0%
                            </label>
                            <label id="lbl-ppn-10" class="radio-label">
                                <input type="radio" name="ppn" value="10" onchange="updatePPN(10)">
                                10%
                            </label>
                            <label id="lbl-ppn-11" class="radio-label active">
                                <input type="radio" name="ppn" value="11" checked onchange="updatePPN(11)">
                                11%
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Products -->
                <div class="form-group" style="margin-bottom: 0;">
                    <div class="products-header">
                        <label class="form-label" style="margin-bottom: 0;">Daftar Transaksi</label>
                        <button onclick="addProduct()" class="btn-add">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Tambah Item
                        </button>
                    </div>
                    <div id="product-list" class="product-list">
                        <!-- Injected via JS -->
                    </div>
                </div>

                <!-- Payment -->
                <div class="payment-section">
                    <label class="form-label" style="color: #3b82f6;">Nominal Pembayaran</label>
                    <div class="input-with-prefix" style="max-width: 100%;">
                        <span class="input-prefix" style="color: #3b82f6;">Rp</span>
                        <input type="number" id="paymentInput" value="100000" oninput="onPaymentChange(this.value)"
                            placeholder="Masukkan uang pembeli" class="glass-input"
                            style="padding-left: 3rem; font-size: 1.1rem; font-weight: 800; color: #1e293b; border-color: rgba(59, 130, 246, 0.3);">
                    </div>
                </div>

                <button onclick="printReceipt()" class="btn-print">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 6 2 18 2 18 9"></polyline>
                        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                        <rect x="6" y="14" width="12" height="8"></rect>
                    </svg>
                    Cetak Nota
                </button>
            </div>

            <!-- PREVIEW SECTION -->
            <div class="preview-section glass-panel" style="padding: 0.5rem; animation-delay: 0.2s;">
                <div class="preview-outer">
                    <h2 class="preview-title">Live Preview</h2>
                    <div class="preview-dots"><span></span><span></span><span></span></div>

                    <div class="receipt-wrapper">
                        <!-- Receipt Document -->
                        <div id="printable-receipt" class="receipt-58">
                            <div class="r-header">
                                <div id="preview-brand" class="r-brand">CAFE AESTHETIC</div>
                                <div id="preview-address" class="r-address">Jl. Jend. Sudirman No. 123, Jakarta</div>
                                <div id="preview-phone" class="r-phone">0812-3456-7890</div>
                            </div>

                            <div class="r-divider"></div>

                            <div class="r-meta">
                                <span>No: <span id="preview-nota">INV-...</span></span>
                                <span id="preview-date"></span>
                            </div>
                            <div class="r-meta" style="margin-bottom: 6px;">
                                <span>Kasir: Admin</span>
                            </div>

                            <div class="r-divider-solid"></div>

                            <div id="preview-products">
                                <!-- Products injected here -->
                            </div>

                            <div class="r-divider-solid"></div>

                            <div class="r-totals">
                                <div class="r-total-row">
                                    <span>Subtotal</span>
                                    <span id="preview-subtotal">Rp 0</span>
                                </div>
                                <div id="preview-ppn-container" class="r-total-row">
                                    <span id="preview-ppn-label">PPN 11%</span>
                                    <span id="preview-ppn-amount">Rp 0</span>
                                </div>

                                <div class="r-divider" style="margin: 6px 0;"></div>

                                <div class="r-grand-total">
                                    <span>TOTAL</span>
                                    <span id="preview-total">Rp 0</span>
                                </div>

                                <div class="r-payment">
                                    <span>Tunai</span>
                                    <span id="preview-payment">Rp 0</span>
                                </div>
                                <div class="r-change">
                                    <span>Kembali</span>
                                    <span id="preview-change">Rp 0</span>
                                </div>
                            </div>

                            <div class="r-divider" style="margin-top: 15px;"></div>

                            <div class="r-footer">
                                <p>TERIMA KASIH</p>
                                <p style="font-weight: 400;">Silakan datang kembali</p>
                                <!-- Barcode generator using font -->
                                <div class="r-barcode-container">
                                    <div id="preview-barcode" class="r-barcode"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // State
        let state = {
            brandName: "CAFE AESTHETIC",
            address: "Jl. Jend. Sudirman No. 123, Jakarta",
            phone: "0812-3456-7890",
            paperSize: "58mm",
            ppnRate: 11,
            payment: 100000,
            notaNumber: "",
            products: [
                { id: 1, name: "Iced Caramel Macchiato", price: 35000, quantity: 2 },
                { id: 2, name: "Classic Croissant", price: 28000, quantity: 1 }
            ]
        };

        const formatRupiah = (number) => new Intl.NumberFormat('id-ID').format(number);

        const generateNotaNumber = () => {
            const date = new Date();
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const random = Math.floor(1000 + Math.random() * 9000);
            return `INV${yyyy}${mm}${dd}-${random}`;
        };

        const updateDate = () => {
            const dateStr = new Date().toLocaleString('id-ID', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            }).replace(/\./g, ':');
            document.getElementById('preview-date').innerText = dateStr;
        };

        // Event Listeners for Header Inputs
        document.getElementById('brandNameInput').addEventListener('input', (e) => { state.brandName = e.target.value; renderPreview(); });
        document.getElementById('addressInput').addEventListener('input', (e) => { state.address = e.target.value; renderPreview(); });
        document.getElementById('phoneInput').addEventListener('input', (e) => { state.phone = e.target.value; renderPreview(); });

        const updatePaperSize = (size) => {
            state.paperSize = size;
            document.querySelectorAll('input[name="paperSize"]').forEach(r => {
                r.parentElement.className = r.value === size ? "radio-label active" : "radio-label";
            });
            document.getElementById('printable-receipt').className = size === '58mm' ? 'receipt-58' : 'receipt-80';

            const pageStyle = document.getElementById('print-page-style');
            if (pageStyle) {
                pageStyle.innerHTML = `@media print { @page { margin: 0; } }`;
            }

            renderPreview();
        };

        const updatePPN = (rate) => {
            state.ppnRate = rate;
            document.querySelectorAll('input[name="ppn"]').forEach(r => {
                r.parentElement.className = parseInt(r.value) === rate ? "radio-label active" : "radio-label";
            });
            renderPreview();
        };

        const onPaymentChange = (value) => {
            state.payment = Number(value);
            renderPreview();
        };

        const addProduct = () => {
            state.products.push({ id: Date.now(), name: "", price: 0, quantity: 1 });
            renderFormProducts();
            renderPreview();
        };

        const removeProduct = (id) => {
            state.products = state.products.filter(p => p.id !== id);
            renderFormProducts();
            renderPreview();
        };

        const onProductChange = (id, field, value) => {
            const product = state.products.find(p => p.id === id);
            if (product) {
                product[field] = field === 'name' ? value : Number(value);
                renderPreview();
            }
        };

        const renderFormProducts = () => {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = '';

            if (state.products.length === 0) {
                listEl.innerHTML = `
                <div style="text-align: center; padding: 2rem; background: rgba(255,255,255,0.5); border-radius: 1rem; border: 1px dashed rgba(148,163,184,0.4);">
                    <p style="color: #64748b; font-size: 0.875rem; font-weight: 500;">Belum ada menu yang dipesan.</p>
                </div>`;
                return;
            }

            state.products.forEach(p => {
                const item = document.createElement('div');
                item.className = "product-item";
                item.innerHTML = `
                    <input type="text" value="${p.name}" oninput="onProductChange(${p.id}, 'name', this.value)" placeholder="Nama Menu / Produk" class="product-name-input">
                    <div class="product-details">
                        <div class="input-with-prefix">
                            <span class="input-prefix">Rp</span>
                            <input type="number" value="${p.price || ''}" oninput="onProductChange(${p.id}, 'price', this.value)" placeholder="Harga">
                        </div>
                        <div class="input-with-prefix qty-input-container">
                            <span class="input-prefix">Qty</span>
                            <input type="number" value="${p.quantity || ''}" oninput="onProductChange(${p.id}, 'quantity', this.value)" min="1" style="text-align: center; font-weight: bold;">
                        </div>
                    </div>
                    <button onclick="removeProduct(${p.id})" class="btn-remove" title="Hapus Item">✕</button>
                `;
                listEl.appendChild(item);
            });
        };

        const renderPreview = () => {
            // Header Info
            document.getElementById('preview-brand').innerText = state.brandName || 'NAMA TOKO';

            const addrEl = document.getElementById('preview-address');
            addrEl.innerText = state.address;
            addrEl.style.display = state.address ? 'block' : 'none';

            const phoneEl = document.getElementById('preview-phone');
            phoneEl.innerText = state.phone;
            phoneEl.style.display = state.phone ? 'block' : 'none';

            document.getElementById('preview-nota').innerText = state.notaNumber;
            document.getElementById('preview-barcode').innerText = "*" + state.notaNumber + "*"; // Barcode format requires *

            // Products
            let subtotal = 0;
            let productsHtml = '';
            state.products.forEach((p, i) => {
                const totalRow = p.price * p.quantity;
                subtotal += totalRow;
                productsHtml += `
                <div class="r-product">
                    <div class="r-product-name">${p.name || `Item ${i + 1}`}</div>
                    <div class="r-product-row">
                        <div>${p.quantity} x ${formatRupiah(p.price)}</div>
                        <div>${formatRupiah(totalRow)}</div>
                    </div>
                </div>
                `;
            });
            document.getElementById('preview-products').innerHTML = productsHtml;

            // Calculations
            const taxAmount = Math.floor(subtotal * (state.ppnRate / 100));
            const total = subtotal + taxAmount;
            const change = state.payment - total;

            document.getElementById('preview-subtotal').innerText = formatRupiah(subtotal);

            const ppnContainer = document.getElementById('preview-ppn-container');
            if (state.ppnRate > 0) {
                ppnContainer.style.display = 'flex';
                document.getElementById('preview-ppn-label').innerText = `PPN ${state.ppnRate}%`;
                document.getElementById('preview-ppn-amount').innerText = formatRupiah(taxAmount);
            } else {
                ppnContainer.style.display = 'none';
            }

            document.getElementById('preview-total').innerText = formatRupiah(total);
            document.getElementById('preview-payment').innerText = formatRupiah(state.payment);

            const changeEl = document.getElementById('preview-change');
            if (change < 0) {
                changeEl.innerText = "Kurang " + formatRupiah(Math.abs(change));
                changeEl.style.color = "#ef4444";
            } else {
                changeEl.innerText = formatRupiah(change);
                changeEl.style.color = "inherit";
            }
        };

        const printReceipt = async () => {
            const receipt = document.getElementById('printable-receipt');
            const height = receipt.offsetHeight;
            const pageStyle = document.getElementById('print-page-style');
            if (pageStyle) {
                // Set the page height dynamically based on the exact receipt height plus a small buffer
                pageStyle.innerHTML = `@media print { @page { size: ${state.paperSize} ${height + 20}px; margin: 0; } }`;
            }

            // Simpan data ke database
            try {
                const response = await fetch('save_nota.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                const result = await response.json();
                if (!result.success) {
                    console.error("Gagal menyimpan ke database:", result.error);
                }
            } catch (err) {
                console.error("Error koneksi database:", err);
            }

            // Allow the browser a split second to apply the new CSS rule before opening the print dialog
            setTimeout(() => {
                window.print();

                // Regenerate nota number for the next transaction after printing
                state.notaNumber = generateNotaNumber();
                renderPreview();
            }, 50);
        };

        // Initialize App
        state.notaNumber = generateNotaNumber();
        updateDate();
        setInterval(updateDate, 30000);
        renderFormProducts();
        renderPreview();
    </script>
</body>

</html>
